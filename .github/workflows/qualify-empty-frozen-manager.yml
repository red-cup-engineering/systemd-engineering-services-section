name: Qualify original empty frozen manager repair
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-native-manager:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and receive original vendor package plus isolated native controls
        env:
          OWNER_COMMIT: ${{ github.sha }}
          SOURCE_DATE_EPOCH: "1793145600"
        run: bash scripts/qualify-empty-frozen-systemd-product.sh "$RUNNER_TEMP/systemd-empty-thaw"
      - name: Retain exact source, package and native receiving product
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: systemd-empty-thaw-${{ github.sha }}
          path: ${{ runner.temp }}/systemd-empty-thaw
          retention-days: 90
          if-no-files-found: error
